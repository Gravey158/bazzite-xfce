name: build-bazzite-xfce

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  schedule:
    # taeglich 06:00 UTC, nach dem taeglichen Upstream-Bazzite-Build
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gravey158/bazzite-xfce
  # rootful podman-Storage auf /mnt (grosszuegig), damit das ~14 GB Image passt
  STORE: --root /mnt/containers --storage-driver overlay

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Speicher freiraeumen + podman sicherstellen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get update -qq && sudo apt-get install -y -qq podman >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/containers
          podman --version || sudo podman --version
          df -h / /mnt

      - name: Image bauen (rootful, wie lokal getestet)
        run: |
          sudo podman $STORE build \
            --cap-add=all \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA}" \
            -f ./Containerfile .

      - name: An ghcr anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Nach ghcr pushen
        run: |
          sudo podman $STORE push "$IMAGE:latest"
          sudo podman $STORE push "$IMAGE:${GITHUB_SHA}"
          echo "Gepusht: $IMAGE:latest"
